name: Build and Deploy Najah

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find and extract source ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP في جذر المستودع."
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          if [ ! -f project/package.json ]; then
            SOURCE_DIR=$(find project -mindepth 1 -maxdepth 2 -name package.json -printf "%h\n" | head -n 1)

            if [ -n "$SOURCE_DIR" ]; then
              cp -a "$SOURCE_DIR"/. project/
            fi
          fi

          if [ ! -f project/package.json ]; then
            echo "لم يتم العثور على package.json داخل الحزمة."
            exit 1
          fi

      - name: Install dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Build application
        working-directory: project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
